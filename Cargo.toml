[package]
name = "upcoming"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.1"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
chrono-tz = "0.10.4"
pretty_assertions = "1.4.1"
tokio = { version = "1.54.1", features = ["test-util"] }
wiremock = "0.6.5"
